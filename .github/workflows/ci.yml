name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

  test-action:
    name: GitHub Actions Test
    runs-on:
      group: ent/Mobile
      labels:
        - self-hosted
        - macOS

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v5

      - name: Fetch AppStore Provisioning Profiles
        id: appstore-provisioning-profiles
        uses: ./
        with:
          appstore-connect-json: ${{ secrets.FFM_ASC_APPSTORE_JSON }}

      - name: Fetch Enterprise Provisioning Profiles
        id: enterprise-provisioning-profiles
        uses: ./
        with:
          appstore-connect-json: ${{ secrets.FFM_ASC_ENTERPRISE_JSON }}

      - name: Print Output
        run: |
          echo 'AppStore Provisioning Profiles:'
          echo '${{ steps.appstore-provisioning-profiles.outputs.profiles }}'
          echo 'Enterprise Provisioning Profiles:'
          echo '${{ steps.enterprise-provisioning-profiles.outputs.profiles }}'
