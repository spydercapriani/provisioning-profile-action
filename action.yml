name: 'Provisioning Profile Action'
description: 'Manage provisioning profiles for iOS projects'
author: 'ForeFlight, LLC'

# Add your action's branding here. This will appear on the GitHub Marketplace.
branding:
  icon: 'heart'
  color: 'red'

# Define your inputs here.
inputs:
  profile-types:
    description:
      'The types of profiles to download. <IOS_APP_DEVELOPMENT, IOS_APP_STORE,
      IOS_APP_ADHOC, IOS_APP_INHOUSE, MAC_APP_DEVELOPMENT, MAC_APP_STORE,
      MAC_APP_DIRECT, TVOS_APP_DEVELOPMENT, TVOS_APP_STORE, TVOS_APP_ADHOC,
      TVOS_APP_INHOUSE>'
    required: false
    default: |
      IOS_APP_DEVELOPMENT
      IOS_APP_STORE
      IOS_APP_ADHOC
      IOS_APP_INHOUSE
  appstore-connect-api-issuer-id:
    description: 'App Store Connect API Issuer ID'
    required: true
  appstore-connect-api-key-id:
    description: 'App Store Connect API Key ID'
    required: true
  appstore-connect-api-key-content:
    description: 'App Store Connect API Key Content'
    required: true

# Define your outputs here.
outputs:
  # Example Output:
  # [
  #   {
  #     "uuid": "9188a3d6-d9a5-443f-b87a-9419e9c50351",
  #     "name": "Some Profile Name",
  #     "path": "${HOME}/Library/MobileDevice/Provisioning Profiles/Some Profile Name.mobileprovision"
  #   }
  # ]
  profiles:
    description:
      'A JSON string containing an array of objects with the `uuid`, `name`, and
      `path` of each provisioning profile'

runs:
  using: node20
  main: dist/index.js
